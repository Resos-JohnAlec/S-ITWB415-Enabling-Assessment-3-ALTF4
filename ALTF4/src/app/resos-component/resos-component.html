<div class="profile-card">
  <img class="profile-photo" src="images/resos.jpg" [alt]="name">
  <div class="profile-content">
    <h2>{{ name }}</h2>
    <p class="subtitle">IT student · Web development</p>
    <button mat-raised-button type="button" (click)="showDescription()" [attr.aria-expanded]="description() !== ''"
      aria-controls="resos-description">
      About me
    </button>
    <p id="resos-description" class="description">{{ description() }}</p>
  </div>
</div>
